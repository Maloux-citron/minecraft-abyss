<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abysse</title>
<style>
  :root { --ui: rgba(210, 240, 255, .92); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #01060d; color: var(--ui);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  canvas#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  /* ---------- HUD profondeur ---------- */
  #hud { position: fixed; z-index: 5; pointer-events: none; text-shadow: 0 1px 12px rgba(0,0,0,.55);
    transition: opacity .6s; user-select: none; }
  #hud.hidden { opacity: 0; }
  #hud.br { right: 4.2vw; bottom: 5vh; text-align: right; }
  #hud.bl { left: 4.2vw; bottom: 5vh; text-align: left; }
  #hud.tr { right: 4.2vw; top: 5vh; text-align: right; }
  #hud.tl { left: 4.2vw; top: 5vh; text-align: left; }
  #hud .lbl { font-size: clamp(9px, .75vw, 13px); letter-spacing: .38em; text-transform: uppercase; opacity: .6; }
  #hud .depth { font-size: clamp(34px, 4.4vw, 84px); font-weight: 200; letter-spacing: .02em; line-height: 1.05;
    font-variant-numeric: tabular-nums; }
  #hud .depth small { font-size: .38em; opacity: .65; margin-left: .25em; letter-spacing: .1em; }
  #hud .zone { font-size: clamp(11px, 1vw, 17px); letter-spacing: .12em; margin-top: .5em; opacity: .85; }
  #hud .meta { font-size: clamp(10px, .85vw, 14px); letter-spacing: .1em; opacity: .55; margin-top: .35em;
    font-variant-numeric: tabular-nums; }
  #gauge { position: fixed; z-index: 5; top: 12vh; bottom: 12vh; width: 2px; background: rgba(200,235,255,.16);
    pointer-events: none; transition: opacity .6s; }
  #gauge.hidden { opacity: 0; }
  #gauge.r { right: 1.6vw; } #gauge.l { left: 1.6vw; }
  #gauge i { position: absolute; left: -4px; width: 10px; height: 1px; background: rgba(200,235,255,.4); }
  #gauge b { position: absolute; left: -5px; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%;
    background: #bff; box-shadow: 0 0 14px 3px rgba(150,230,255,.8); }

  /* ---------- Panneau navigateur (masqué dans Wallpaper Engine) ---------- */
  #gear { position: fixed; z-index: 10; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(190,235,255,.25); background: rgba(5,25,45,.45); color: var(--ui); cursor: pointer;
    font-size: 20px; backdrop-filter: blur(8px); opacity: .0; transition: opacity .3s; }
  body:hover #gear, #gear:focus { opacity: .8; }
  body.we #gear, body.we #panel { display: none !important; }
  #panel { position: fixed; z-index: 11; top: 62px; right: 14px; width: 330px; max-height: calc(100vh - 80px);
    overflow: auto; padding: 16px 18px 18px; border-radius: 14px; background: rgba(4,20,38,.82);
    border: 1px solid rgba(190,235,255,.2); backdrop-filter: blur(14px); display: none; font-size: 13px; }
  #panel.open { display: block; }
  #panel h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; letter-spacing: .04em; }
  #panel label { display: block; margin: 11px 0 4px; opacity: .75; font-size: 12px; }
  #panel input[type=text], #panel select { width: 100%; padding: 8px 10px; border-radius: 8px; color: #e8f8ff;
    border: 1px solid rgba(190,235,255,.25); background: rgba(0,10,22,.6); font: inherit; }
  #panel input[type=range] { width: 100%; }
  #panel .row { display: flex; gap: 8px; } #panel .row > * { flex: 1; }
  #panel button, #panel .btn { padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(120,220,255,.5);
    background: rgba(40,140,190,.35); color: #eaffff; cursor: pointer; font: inherit; text-align: center; }
  #panel button:hover, #panel .btn:hover { background: rgba(60,170,220,.5); }
  #panel .chk { display: flex; align-items: center; gap: 8px; margin: 9px 0 0; opacity: .9; cursor: pointer; }
  #panel .note { font-size: 11.5px; opacity: .6; margin-top: 10px; line-height: 1.45; }
  #status { min-height: 1.3em; margin-top: 8px; font-size: 12px; color: #9fe; }
  #drop { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
    background: rgba(0,30,50,.7); font-size: 28px; font-weight: 300; letter-spacing: .1em; backdrop-filter: blur(6px); }
  #drop.on { display: flex; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
    padding: 30px; z-index: 30; background: #01060d; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" class="br">
  <div class="lbl">Profondeur</div>
  <div class="depth"><span id="hDepth">0</span><small>m</small></div>
  <div class="zone" id="hZone"></div>
  <div class="meta" id="hMeta"></div>
</div>
<div id="gauge" class="r"><b id="gMark"></b></div>

<button id="gear" title="Réglages">⚙</button>
<div id="panel">
  <h2>Abysse</h2>

  <label>Pseudo Minecraft (Java)</label>
  <div class="row">
    <input type="text" id="uName" placeholder="ex : Notch" spellcheck="false" style="flex:2">
    <button id="uLoad" style="flex:1">Charger</button>
  </div>

  <label>…ou ton fichier de skin (PNG 64×64)</label>
  <label class="btn" style="margin:0;display:block;opacity:1">Choisir un fichier…
    <input type="file" id="uFile" accept="image/png" hidden>
  </label>
  <div id="status"></div>

  <label>Bras</label>
  <select id="sArms"><option value="auto">Automatique</option><option value="classic">Classique (Steve)</option><option value="slim">Fins (Alex)</option></select>
  <label>Pose</label>
  <select id="sPose">
    <option value="drift">Chute verticale (dérive)</option>
    <option value="head">Plongeon tête en bas</option>
    <option value="spin">Rotation lente</option>
    <option value="tumble">Culbute</option>
  </select>
  <label>Palette de l'océan</label>
  <select id="sPal"><option value="ocean">Bleu océan</option><option value="tropic">Turquoise tropical</option><option value="green">Vert profond</option><option value="violet">Violet abyssal</option></select>

  <label>Vitesse de chute</label><input type="range" id="sSpeed" min="0.1" max="2" step="0.05">
  <label>Volume du son</label><input type="range" id="sVolume" min="0" max="1" step="0.02">
  <label>Bloom (lueur)</label><input type="range" id="sBloom" min="0" max="2" step="0.05">
  <label>Bulles</label><input type="range" id="sBubbles" min="0" max="1.5" step="0.05">
  <label>Qualité</label>
  <select id="sQ"><option value="low">Basse</option><option value="med">Moyenne</option><option value="high">Haute</option></select>

  <label>Résolution du rendu (%) — plus bas = plus de FPS</label><input type="range" id="sScale" min="50" max="100" step="5">
  <label class="chk"><input type="checkbox" id="sAuto"> Ajuster la résolution automatiquement (fluidité)</label>
  <label class="chk"><input type="checkbox" id="sSound"> Ambiance sonore relaxante</label>
  <label class="chk"><input type="checkbox" id="sHud"> Afficher la profondeur</label>
  <label class="chk"><input type="checkbox" id="sLoop"> Recommencer en boucle</label>
  <label class="chk"><input type="checkbox" id="sLife"> Créatures marines</label>
  <label class="chk"><input type="checkbox" id="sLamp"> Lampe de plongeur</label>
  <div class="row" style="margin-top:14px"><button id="bFull">Plein écran</button><button id="bRestart">Rejouer</button></div>
  <div class="note">Astuce : glisse-dépose un PNG de skin n'importe où sur la page. Dans Wallpaper Engine, tout se règle depuis ses propres propriétés.</div>
</div>
<div id="toast" style="position:fixed;left:4vw;bottom:4vh;z-index:9;max-width:60vw;padding:8px 12px;border-radius:8px;background:rgba(0,20,40,.7);font-size:13px;opacity:0;transition:opacity .4s;pointer-events:none"></div>
<div id="soundHint" style="display:none;position:fixed;left:50%;bottom:4vh;transform:translateX(-50%);z-index:9;padding:8px 14px;border-radius:20px;background:rgba(0,20,40,.7);font-size:13px;letter-spacing:.05em;pointer-events:none">🔊 Clique n'importe où pour activer le son</div>
<div id="drop">Dépose ton skin ici</div>
<div id="err"><div><h2>WebGL indisponible</h2><p>Ce fond d'écran a besoin de l'accélération graphique (WebGL).</p></div></div>

<div id="errbox" style="position:fixed;left:8px;top:8px;right:8px;z-index:99;display:none;padding:8px 10px;background:rgba(120,0,0,.88);color:#fff;font:12px Consolas,monospace;white-space:pre-wrap;max-height:40vh;overflow:auto"></div>
<script>
(function () {
  var b = document.getElementById('errbox');
  function show(m) { b.style.display = 'block'; if (b.textContent.length < 1500) b.textContent += m + '\n'; }
  window.addEventListener('error', function (e) { show('Erreur : ' + e.message + ' (' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ')'); });
  window.addEventListener('unhandledrejection', function (e) { show('Promesse rejetée : ' + ((e.reason && e.reason.message) || e.reason)); });
})();
</script>
<script src="three.min.js"></script>
<script src="ambience.js"></script>
<script src="app.js"></script>
</body>
</html>
